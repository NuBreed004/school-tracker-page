<title>Школа</title>
<style>
:root { --bg: #f6f6f4; --card: #fff; --text: #1c1c1e; --muted: #66666c; --line: #e2e2de; --accent: #2b57c9; --err: #9b1c1c; }
@media (prefers-color-scheme: dark) { :root { --bg: #111113; --card: #1b1b1f; --text: #f2f2f4; --muted: #a3a3ab; --line: #2d2d33; --accent: #85a3ff; --err: #ffb3b3; } }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
form { max-width: 340px; margin: 18vh auto 0; padding: 0 16px; display: grid; gap: 10px; }
h1 { font-size: 26px; margin: 0 0 4px; }
input[type=password] { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); }
button { font: inherit; padding: 10px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
label { font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
#err { color: var(--err); font-size: 14px; min-height: 1.2em; }
</style>

  const KEY = 'school.pagekey';
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const store = {
    get() { try { return localStorage.getItem(KEY); } catch { return null; } },
    set(v) { try { localStorage.setItem(KEY, v); } catch { /* private mode */ } },
    drop() { try { localStorage.removeItem(KEY); } catch { /* private mode */ } },
  };
  async function open(rawKey) {
    const key = await crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(IV) }, key, b64(DATA));

    document.open(); document.write(html); document.close();
  }
  async function derive(password) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);

  const saved = store.get();
  if (saved) open(b64(saved)).catch(() => store.drop());
  document.getElementById('f').addEventListener('submit', async ev => {
    ev.preventDefault();
    const err = document.getElementById('err');
    err.textContent = '';
    try {
      const raw = await derive(document.getElementById('pw').value);
